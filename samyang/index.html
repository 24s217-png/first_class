<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼양식품리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendard.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
    <style>
        #wrap { background-color: yellow; }
    </style>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <div class="hero-sec">
                  <!-- Slider main container -->
                <div class="swiper">
                <!-- Additional required wrapper -->
                <div class="swiper-wrapper">
                    <!-- Slides -->
                    <div class="swiper-slide"> 
                        <img src="img\1.png" alt="1배너" class="pc">
                        <img src="img\1_M.png" alt="1M배너" class="mo">
                    </div>
                    <div class="swiper-slide">
                        <img src="img\2.png" alt="2배너" class="pc">
                        <img src="img\2_M.png" alt="2M배너" class="mo">
                    </div>
                </div>
                <!-- If we need pagination -->
                <div class="swiper-pagination"></div>

                <!-- If we need navigation buttons -->
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>

                <!-- If we need scrollbar -->
                <div class="swiper-scrollbar"></div>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
        const swiper = new Swiper('.hero-sec .swiper', {
        // Optional parameters
        direction: 'horizontal',
        loop: true,

        // If we need pagination
        pagination: {
            el: '.swiper-pagination',
        },

        // Navigation arrows
        navigation: {
            nextEl: '.hero-sec .swiper-button-next',
            prevEl: '.hero-sec .swiper-button-prev',
        },

        // And if we need scrollbar
        scrollbar: {
            el: '.swiper-scrollbar',
        },
        });
    </script>
</body>
</html>
