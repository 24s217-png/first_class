<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="login.css">

    <title>동원그룹 로그인</title>
</head>

<body>
    <div id="wrap">

        <header class="header">
            <button type="button" class="back_btn">
                <span class="sr-only">이전</span>
                <img src="../bk/img/back_icon.svg" alt="">
            </button>

            <div class="brand" aria-label="동원그룹">
                DONGWON
            </div>
        </header>

        <main>
            <section class="intro">
                <h1>로그인</h1>
                <p>이메일 주소와 비밀번호를 입력해 주세요</p>
            </section>

            <form action="" method="post" class="login_form">
                <fieldset>
                    <legend class="sr-only">이메일 로그인</legend>

                    <div class="input_group">
                        <label for="email">이메일 로그인</label>

                        <div class="input_box">
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="이메일 주소를 입력해 주세요."
                            >
                        </div>

                        <div class="input_box password_box">
                            <label class="sr-only" for="password">
                                비밀번호
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="비밀번호를 입력해 주세요."
                            >

                            <button type="button" class="eye_btn">
                                <span class="sr-only">비밀번호 보기</span>
                                <img src="../bk/img/eye_icon.svg" alt="">
                            </button>
                        </div>
                    </div>

                    <div class="login_options">
                        <label class="check_item">
                            <input type="checkbox" name="auto_login">
                            <img src="../bk/img/checkbox_disabled.svg" alt="">
                            <span>자동 로그인</span>
                        </label>

                        <label class="check_item">
                            <input type="checkbox" name="save_id">
                            <img src="../bk/img/checkbox_disabled.svg" alt="">
                            <span>아이디 저장</span>
                        </label>
                    </div>

                    <button type="submit" class="login_btn">
                        로그인
                    </button>
                </fieldset>
            </form>

            <nav class="login_links" aria-label="회원 관련 메뉴">
                <a href="#">아이디 찾기</a>
                <span aria-hidden="true"></span>
                <a href="#">비밀번호 재설정</a>
                <span aria-hidden="true"></span>
                <a href="#">회원가입</a>
            </nav>

            <section class="sns_login">
                <div class="sns_title">
                    <span></span>
                    <h2>SNS으로 간편하게 로그인</h2>
                    <span></span>
                </div>

                <div class="sns_list">
                    <a href="#" aria-label="카카오 로그인">
                        <img src="../bk/img/kakao_logo_icon.svg" alt="">
                    </a>
                    <a href="#" aria-label="네이버 로그인">
                        <img src="../bk/img/naver_logo_icon.svg" alt="">
                    </a>
                    <a href="#" aria-label="Apple 로그인">
                        <img src="../bk/img/apple_logo_icon.svg" alt="">
                    </a>
                    <a href="#" aria-label="동원그룹 로그인">
                        <img src="../bk/img/samsung_logo_icon.svg" alt="">
                    </a>
                </div>
            </section>
        </main>

    </div>
</body>
</html>
